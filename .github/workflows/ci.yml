# Pemeriksaan cepat setiap push/PR: vet + test Go dan build frontend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang dependensi build (GTK4 + WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      # embed all:frontend/dist di desktop/main.go butuh hasil build frontend ada.
      - name: Build frontend
        working-directory: desktop/frontend
        run: |
          npm install
          npm run build
          npm test
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build frontend
        working-directory: desktop/frontend
        run: |
          npm install
          npm run build
